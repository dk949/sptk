name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: macos-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --release --verbose
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/sptk-${{ matrix.target }}.tar.gz" -C target/release sptk
      - uses: actions/upload-artifact@v4
        with:
          name: sptk-${{ matrix.target }}
          path: dist/sptk-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Read tag message
        id: tag
        run: |
          tag="${{ github.ref_name }}"
          {
            echo "subject<<EOF"
            git tag -l --format='%(contents:subject)' "$tag"
            echo EOF
            echo "body<<EOF"
            git tag -l --format='%(contents:body)' "$tag"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          name: ${{ steps.tag.outputs.subject }}
          body: ${{ steps.tag.outputs.body }}
          fail_on_unmatched_files: true
