name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify-version:
    name: verify Cargo.toml matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare Cargo.toml version to tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          echo "tag=$tag cargo=$cargo_ver"
          if [ "$tag" != "$cargo_ver" ]; then
            echo "::error::Cargo.toml version ($cargo_ver) does not match tag ($GITHUB_REF_NAME)."
            echo "::error::Use \`cargo release\` so the version bump, commit, and tag stay in lockstep."
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: macos-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --release --verbose
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/sptk-${{ matrix.target }}.tar.gz" -C target/release sptk
      - uses: actions/upload-artifact@v7
        with:
          name: sptk-${{ matrix.target }}
          path: dist/sptk-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Read tag message
        id: tag
        run: |
          tag="${{ github.ref_name }}"
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          {
            echo "subject<<EOF"
            git tag -l --format='%(contents:subject)' "$tag"
            echo EOF
            echo "body<<EOF"
            git tag -l --format='%(contents:body)' "$tag"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Delete pre-existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" 2>/dev/null || true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          name: ${{ steps.tag.outputs.subject }}
          body: ${{ steps.tag.outputs.body }}
          fail_on_unmatched_files: true
